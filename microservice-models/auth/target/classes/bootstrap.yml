server:
  port: 9090

spring:
  application:
    name: auth-service
  profiles:
    active: dev
  cloud:
    nacos:
      # 配置中心和服务注册中心统一用server-addr
      server-addr: 182.254.228.15:8848
      config:
        import-check:
          enabled: false
        namespace: be652ec9-7287-4078-b51c-10e62c812098
        group: AUTH_GROUP
        file-extension: yaml
        refresh-enabled: true
        extension-configs[0]:
          data-id: application-auth-dev.yml
          group: AUTH_GROUP
          refresh: true
        extension-configs[1]:
          data-id: JwtProperties.yml
          group: AUTH_GROUP
          refresh: true
      discovery:
        namespace: be652ec9-7287-4078-b51c-10e62c812098  # 把服务注册到 dev


    sentinel:

      jvmArgs: -Dcsp.sentinel.log.dir=D:/sentinel-logs/csp/