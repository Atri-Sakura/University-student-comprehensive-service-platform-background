server:
  port: 9090

spring:
  application:
    name: user-service
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        namespace: ${spring.profiles.active:dev}
        group: USER_GROUP
        file-extension: yml


    sentinel:

      jvmArgs: -Dcsp.sentinel.log.dir=D:/sentinel-logs/csp/
  config:
    import: "nacos:application-dev.yml?group=USER_GROUP&namespace=${spring.profiles.active:dev}"